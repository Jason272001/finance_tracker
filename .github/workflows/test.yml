name: Test launch readiness
on:
  pull_request:
  push:
    branches: [master, 'codex/**']
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: keeperbma_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: keeperbma_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KEEPERBMA_TEST_POSTGRES_URL: postgresql+psycopg2://keeperbma_test:test_only_password@127.0.0.1:5432/keeperbma_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements-*.txt'
      - run: pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/sync_web_entries.py
      - run: python scripts/build_static.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontends/mobile/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node --check frontends/web/web.js
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm ci --prefix frontends/mobile --ignore-scripts
      - run: node frontends/mobile/node_modules/typescript/bin/tsc --noEmit -p frontends/mobile
  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontends/android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix frontends/android --ignore-scripts
      - run: npm run cap:sync --prefix frontends/android
      - name: Compile Android companion and local export plugin
        working-directory: frontends/android/android
        run: bash ./gradlew :app:assembleDebug --no-daemon
